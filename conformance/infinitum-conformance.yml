source: https://support.goinfinitum.com/hc/en-us
summary: >-
  Infinitum's integration surface is a fieldbus and control-wiring surface on the motor itself,
  not an HTTP contract. Its documented interoperability standards are building-automation
  protocols - BACnet MS/TP, Modbus TCP and analog/digital I/O - published as PDF manuals in the
  Zendesk support portal. An HTTP/JSON API over the Motor Selection Tool and Fan Selection Tool is
  documented to exist, but its reference sits behind a sign-in and an NDA, so no machine-readable
  contract could be fetched and no contract-level standard signature could be observed.
