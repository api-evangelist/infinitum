domain_standard_conformance:
  asserted: false
  reason: >-
    NOT asserted. BACnet and Modbus are genuine domain standards for building automation and
    Infinitum genuinely implements them, but the 0.12.0 check reads a signature in the CONTRACT -
    a schema URN, a metadata surface, a topic namespace - and Infinitum publishes no fetchable
    contract at all. Crediting it from a PDF manual would be crediting a claim, which is exactly
    what the check was written to stop.
compliance:
  published: false
  note: >-
    The only certification Infinitum publishes is product safety: ETL certification through
    Intertek for named motor frame sizes (https://goinfinitum.com/certifications/, HTTP 200).
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP posture and no trust center were found, so no
    Compliance or TrustCenter pointer is emitted.
commercial_surface:
  published_plans: false
  published_rate_limits: false
  note: >-
    Infinitum publishes no API pricing tiers and no rate limits - both would be issued with the
    credentials, which are issued on request under a commercial agreement. No RateLimits pointer
    is emitted for this provider: a rate-limits artifact recording a zero would still read as a
    documented rate-limit signal to the scorer, and Infinitum documents none.
