aid: infinitum
name: Infinitum
description: >-
  Infinitum (formerly Infinitum Electric) is an Austin, Texas motor manufacturer, founded in 2016
  by Ben Schuler, that builds the Aircore EC+ family of air-core printed-circuit-board (PCB) stator
  electric motors along with integrated fan and pump systems, Active Front End (AFE) drives, power
  generation packages and off-road traction motors for data centers, commercial and industrial
  buildings, water and wastewater treatment, agriculture and mobility. Its software surface is
  operator tooling rather than a developer platform: the I-con motor control application for
  commissioning, monitoring and diagnostics, a browser-based Motor Selection Tool (MST) and Fan
  Selection Tool (FST), an IoT kit for telemetry, and BACnet, Modbus and analog/digital field
  integration on the motor itself. Infinitum does document an HTTP API for the selection tools -
  fan selection, motor selection and fan chart endpoints - but the reference is served behind an
  account sign-in and the company states that detailed API documentation and advanced integration
  require a signed NDA and a commercial agreement, so no public contract is reachable.
