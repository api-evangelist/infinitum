apis:
- name: Infinitum Selection Tools API
  description: >-
    An HTTP/JSON API over Infinitum's Motor Selection Tool (MST) and Fan Selection Tool (FST),
    documented by Infinitum for third-party integration with BMS, design software and internal
    tools. Infinitum's own support article names three endpoints in limited release - a fan
    selection endpoint (inputs airflow CFM and static pressure, returns matching fan systems as
    JSON), a motor selection endpoint (returns matching motor configurations as JSON) and a fan
    chart endpoint (returns a base64 JPEG performance chart) - and points at MST API
    documentation at https://mst.goinfinitum.com/docs/api. That reference 307-redirects to a
    sign-in, endpoint URLs and credentials are issued on request, and Infinitum states that
    detailed API documentation requires a valid NDA and a commercial agreement. No baseURL is
    recorded here because Infinitum does not publish one.
  humanURL: https://mst.goinfinitum.com/docs/api
  tags:
  - Fan Selection
  - Motor Selection
  - HVAC
  - Building Automation
  x-access: gated
  x-access-note: >-
    Probed 2026-08-23: https://mst.goinfinitum.com/docs/api -> 307 to /sign-in. Access to the
    reference requires an account; full API documentation requires an NDA and commercial
    agreement per https://support.goinfinitum.com/hc/en-us/articles/52467614888851
  properties:
